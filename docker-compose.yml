# owui-surrealdb-adapter — Full stack: Open WebUI + SurrealDB
#
# Usage:
#   docker compose up -d
#   Open http://localhost:3000

services:
  surrealdb:
    image: surrealdb/surrealdb:v3.1
    user: root
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb:/data/db
    expose:
      - "8000"
    volumes:
      - surrealdb-data:/data/db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 5s
      timeout: 3s
      retries: 10

  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:8080"
    environment:
      # Vector DB — SurrealDB
      - VECTOR_DB=surrealdb
      - SURREALDB_URI=ws://surrealdb:8000/rpc
      - SURREALDB_NS=owui
      - SURREALDB_DB=vectors
      - SURREALDB_USER=root
      - SURREALDB_PASS=root
      - SURREALDB_TABLE_PREFIX=owui_
      - SURREALDB_INDEX_TYPE=hnsw
    volumes:
      - owui-data:/app/backend/data
    depends_on:
      surrealdb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  surrealdb-data:
  owui-data:
